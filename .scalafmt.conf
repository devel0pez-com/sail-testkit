version = "3.8.3"
runner.dialect = scala213
maxColumn = 100

# Sail's feature files live in the `sail-features/` submodule and must stay
# byte-identical to upstream: the moment we reformat them, a difference stops
# meaning "Sail and Spark disagree" and starts meaning "we edited the question".
# scalafmt only touches .scala files, so this is belt and braces — but CI runs
# `scalafmt --test .` from the repo root, which walks the submodule too.
project.excludePaths = [
  "glob:**/sail-features/**"
]
