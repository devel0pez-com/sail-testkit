version = "3.8.3"
runner.dialect = scala213
maxColumn = 100

# Sail's feature files live under src/test/resources and must stay byte-identical
# to upstream: the moment we reformat them, a difference stops meaning "Sail and
# Spark disagree" and starts meaning "we edited the question". scalafmt only
# touches .scala files, so this is belt and braces — but the rule is worth
# stating where someone will read it.
project.excludePaths = [
  "glob:**/src/test/resources/**"
]
