name: release

# Tags only. A release is a deliberate act, so it is spelled as one: nothing
# publishes because a branch moved.
#
# The tag must start with `v` — Central rejects a non-SNAPSHOT version published
# without it. sbt-dynver reads the version from the tag, so `v0.1.0-M1` becomes
# `0.1.0-M1`, a real and permanent release, not a draft.
#
# `workflow_dispatch` keeps the one thing the old `push: branches` trigger was
# good for: run it by hand on an untagged commit and dynver produces a
# `-SNAPSHOT`, which exercises credentials, signing and upload without putting
# an immutable version on Central. Worth doing once before the first real tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # sbt-dynver reads the version from the git history
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
