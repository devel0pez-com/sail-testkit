# Scala Steward's configuration for this repository.
#
# Spark and Scala are deliberately absent: they live in versions.json behind a
# function that build.sbt reads, so no bot can see them. That is the point —
# bumping Spark forces bumping pysail with it, and that pairing is a decision,
# not an update.

# sbt 2 is a migration, not a bump: a new build language, plugins that have to
# catch up, and nothing this project needs. Pinning to the 1.x line keeps the
# patch releases arriving without proposing the jump every Monday. Revisit when
# sbt 2 is where the ecosystem actually is, not before.
updates.pin = [
  { groupId = "org.scala-sbt", artifactId = "sbt", version = "1." }
]

# Match what Dependabot writes, so the log reads as one history instead of two
# conventions side by side: "build(deps): bump actions/checkout from 4 to 7"
# next to "Update scalatest to 3.2.20". The same template becomes the pull
# request title, and naming both versions means the log says how far a bump
# moved without opening the diff.
commits.message = "build(deps): bump ${artifactName} from ${currentVersion} to ${nextVersion}"
